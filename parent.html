<!doctype html>
<!-- 학부모 전용 월간 리포트 화면: 선생님이 보낸 링크(학생 번호 + 서명 열쇠)로만 그 학생의 리포트를 본다 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>코드마루 월간 리포트</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  body { word-break:keep-all; margin:0; background:#f7f5ff; color:#231d38; font:16px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:18px 14px 40px; }
  .nav { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:0 0 12px; }
  .nav button { min-width:44px; min-height:44px; border:1px solid #d9d1ee; background:#fff; border-radius:12px; font:inherit; font-size:18px; color:#5b3fa0; cursor:pointer; }
  .nav button:disabled { opacity:.35; }
  .nav b { font-size:18px; }
  img { width:100%; display:block; border-radius:16px; box-shadow:0 8px 28px #2a1d5a1f; }
  #msg { text-align:center; color:#5f586b; padding:40px 10px; }
  .foot { text-align:center; color:#5f586b; font-size:13px; margin-top:18px; }
  .foot a { color:#5b3fa0; }
</style>
</head>
<body>
<main>
  <div class="nav" id="nav" hidden>
    <button type="button" id="prev" aria-label="지난달">‹</button>
    <b id="label"></b>
    <button type="button" id="next" aria-label="다음 달">›</button>
  </div>
  <p id="msg" role="status">리포트를 불러오는 중이에요…</p>
  <div id="out"></div>
  <p class="foot">코드마루 코딩·AI 탐구학원 · <a href="tel:010-9855-1322">010-9855-1322</a><br>이 링크는 우리 아이 전용이에요. 다른 사람에게 전달하지 말아 주세요.</p>
</main>
<script src="record.js"></script>
<script src="report.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search), s = q.get('s'), t = q.get('t');
  var now = new Date(), cur = q.get('m') || (now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2));
  var thisMonth = now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2);
  var $ = function (id) { return document.getElementById(id); };
  function shift(m, n) { var p = m.split('-').map(Number), d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2); }
  function label(m) { var p = m.split('-'); return p[0] + '년 ' + Number(p[1]) + '월'; }
  async function load(m) {
    cur = m; $('label').textContent = label(m); $('next').disabled = m >= thisMonth;
    $('msg').hidden = false; $('msg').textContent = '리포트를 불러오는 중이에요…'; $('out').textContent = '';
    try {
      var d = await CHRecord.api('parentReport', { s: s, t: t, m: m });
      var info = { name: d.student.name, group: d.student.group, month: m, plan: d.report ? d.report.plan : '', comment: d.report ? d.report.comment : '',
        data: CHReport.collect({ workbooks: d.workbooks, pointHistory: d.pointHistory }, d.student, m) };
      if (!info.comment) info.comment = '이 달의 선생님 한마디는 아직 없어요.';
      var img = new Image(); img.alt = d.student.name + ' 학생 ' + label(m) + ' 리포트';
      img.src = CHReport.draw(info).toDataURL('image/png');
      $('out').appendChild(img); $('msg').hidden = true; $('nav').hidden = false;
      history.replaceState(null, '', '?s=' + encodeURIComponent(s) + '&t=' + encodeURIComponent(t) + '&m=' + m);
    } catch (e) { $('msg').textContent = e.message || '리포트를 불러오지 못했어요.'; $('nav').hidden = !s; }
  }
  if (!s || !t) { $('msg').textContent = '링크가 올바르지 않아요. 학원에서 받은 링크로 다시 열어 주세요.'; return; }
  $('prev').onclick = function () { load(shift(cur, -1)); };
  $('next').onclick = function () { load(shift(cur, 1)); };
  load(cur);
})();
</script>
</body>
</html>
