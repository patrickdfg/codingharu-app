<header class="ad-top">
  <a class="ad-brand" href="admin.html#home"><img src="icons/icon-192.png" alt="" width="34" height="34">코드마루 <small>관리자</small></a>
  <span class="ad-who" id="who"></span>
  <a class="ad-btn ghost" href="v/index.html">교안 열기</a>

<div class="ad-wrap">
  <nav class="ad-nav" aria-label="관리자 메뉴">
