<!doctype html>
<!-- 코딩하루 수업 기록 로그인: 선생님 구글 로그인으로 기기를 한 번 등록하고, 수업 때 학생이 이름과 4자리 번호로 들어온다 -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#234c3d">
<title>코딩하루 · 학생 선택</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --green:#234c3d; --bg:#f8f9f4; --ink:#1d2b25; --line:#cfd8d2; --warn:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:18px/1.6 system-ui,"Noto Sans KR",sans-serif; }
  main { width:min(920px,94vw); margin:0 auto; padding:36px 0 60px; text-align:center; }
  header img { width:72px; height:72px; border-radius:18px; }
  h1 { margin:10px 0 4px; font-size:28px; color:var(--green); }
  p.lead { margin:0 0 24px; color:#4b5b54; }
  #msg { min-height:1.6em; margin:14px 0; font-weight:700; color:var(--warn); }
  #msg.ok { color:var(--green); }
  [hidden] { display:none !important; }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px 22px; margin:0 auto; max-width:520px; }
  #gbtn { display:flex; justify-content:center; min-height:44px; margin:14px 0 6px; }
  button { font:700 18px system-ui,sans-serif; border:0; border-radius:14px; cursor:pointer; }
  .link { background:none; color:var(--green); text-decoration:underline; font-weight:600; padding:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; text-align:left; }
  .grid button { background:#fff; border:2px solid var(--line); padding:18px 16px; color:var(--ink); text-align:center; font-size:20px; transition:transform .15s,border-color .15s; }
  .grid button:hover { border-color:var(--green); transform:translateY(-2px); }
  .grid button small { display:block; font-size:13px; color:#6b7a72; font-weight:500; }
  h2.group { font-size:15px; color:#6b7a72; text-align:left; margin:22px 0 8px; }
  .pin-box { max-width:360px; margin:0 auto; }
  .dots { display:flex; justify-content:center; gap:14px; margin:18px 0; }
  .dots span { width:20px; height:20px; border-radius:50%; border:2px solid var(--green); }
  .dots span.on { background:var(--green); }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .pad button { background:#fff; border:2px solid var(--line); padding:16px 0; font-size:26px; color:var(--ink); }
  .pad button:active { background:#e4ece1; }
  .pad .wide { font-size:17px; }
  footer { margin-top:34px; font-size:14px; color:#6b7a72; }
</style>
</head>
<body>
<main>
  <header><img src="icons/icon-192.png" alt="" width="72" height="72"><h1>코딩하루</h1></header>

  <!-- 1. 선생님 구글 로그인 (기기마다 한 번) -->
  <section id="pair" hidden>
    <p class="lead">이 태블릿을 처음 쓰려면 <b>선생님</b>이 구글로 한 번 로그인해 주세요.<br>그다음부터는 학생이 이름만 고르면 돼요.</p>
    <div class="card">
      <div id="gbtn"></div>
      <button class="link" id="skip" type="button">로그인 없이 쓰기 (기록은 이 기기에만 남아요)</button>
    </div>
  </section>

  <!-- 2. 학생 고르기 -->
  <section id="pick" hidden>
    <p class="lead">내 이름을 눌러 주세요.</p>
    <div id="list"></div>
  </section>

  <!-- 3. 4자리 번호 -->
  <section id="pin" hidden>
    <p class="lead"><b id="who"></b> 학생, 내 번호 4자리를 눌러 주세요.</p>
    <div class="pin-box">
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="pad" id="pad">
        <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button><button class="wide" data-k="back">다시 고르기</button><button>0</button><button class="wide" data-k="del">지우기</button>
      </div>
    </div>
  </section>

  <p id="msg" role="status" aria-live="polite"></p>
  <footer id="foot" hidden><span id="teacher"></span> · <button class="link" id="unpair" type="button">이 기기 등록 해제</button></footer>
</main>

<script src="record.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg');
  function say(t, ok) { msg.textContent = t || ''; msg.className = ok ? 'ok' : ''; }
  function show(id) { ['pair', 'pick', 'pin'].forEach(function (x) { $(x).hidden = x !== id; }); }
  var next = new URLSearchParams(location.search).get('next');
  function done() { location.replace(next && /^v\//.test(next) ? next : 'v/index.html'); }

  function footer() {
    var d = CHRecord.device();
    $('foot').hidden = !d;
    if (d) $('teacher').textContent = '등록한 선생님: ' + d.teacher;
  }

  // ---- 1. 선생님 구글 로그인 ----
  function startPair(cfg) {
    show('pair'); footer();
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = function () {
      google.accounts.id.initialize({ client_id: cfg.clientId, callback: onCredential, ux_mode: 'popup', auto_select: false });
      google.accounts.id.renderButton($('gbtn'), { theme: 'filled_blue', size: 'large', text: 'signin_with', shape: 'pill', locale: 'ko', width: 280 });
    };
    s.onerror = function () { say('구글 로그인을 불러오지 못했어요. 인터넷을 확인해 주세요.'); };
    document.head.appendChild(s);
  }
  async function onCredential(res) {
    say('선생님 계정을 확인하는 중…', true);
    try {
      var out = await CHRecord.api('pair', { idToken: res.credential, device: navigator.userAgent });
      CHRecord.setDevice({ token: out.token, teacher: out.teacher });
      try { localStorage.removeItem('codingharu-record-skip'); } catch (e) {}
      say('');
      loadStudents();
    } catch (err) { say(err.message); }
  }
  $('skip').onclick = function () {
    try { localStorage.setItem('codingharu-record-skip', 'true'); } catch (e) {}
    CHRecord.setStudent(null);
    location.replace('v/index.html');
  };

  // ---- 2. 학생 고르기 ----
  var chosen = null;
  async function loadStudents() {
    show('pick'); footer(); say('학생 목록을 불러오는 중…', true);
    try {
      var out = await CHRecord.api('students');
      var groups = {};
      out.students.forEach(function (s) { (groups[s.group || ''] = groups[s.group || ''] || []).push(s); });
      var box = $('list'); box.innerHTML = '';
      Object.keys(groups).sort().forEach(function (gname) {
        if (gname) { var h = document.createElement('h2'); h.className = 'group'; h.textContent = gname; box.appendChild(h); }
        var grid = document.createElement('div'); grid.className = 'grid';
        groups[gname].forEach(function (s) {
          var b = document.createElement('button'); b.type = 'button'; b.textContent = s.name;
          var sm = document.createElement('small'); sm.textContent = s.id + '번'; b.appendChild(sm);
          b.onclick = function () { chosen = s; askPin(); };
          grid.appendChild(b);
        });
        box.appendChild(grid);
      });
      say(out.students.length ? '' : '학생 목록이 비어 있어요. 기록 시트의 학생 탭에 학생을 적어 주세요.');
    } catch (err) {
      if (err.unpaired) { CHRecord.forgetDevice(); return boot(); }
      say(err.message);
    }
  }

  // ---- 3. 4자리 번호 ----
  var pin = '';
  function dots() { [].forEach.call(document.querySelectorAll('.dots span'), function (d, i) { d.className = i < pin.length ? 'on' : ''; }); }
  function askPin() { pin = ''; dots(); $('who').textContent = chosen.name; show('pin'); say(''); }
  $('pad').addEventListener('click', async function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k === 'back') { show('pick'); say(''); return; }
    if (b.dataset.k === 'del') { pin = pin.slice(0, -1); dots(); return; }
    if (pin.length >= 4) return;
    pin += b.textContent.trim(); dots();
    if (pin.length < 4) return;
    say('확인하는 중…', true);
    try {
      var out = await CHRecord.api('pick', { studentId: chosen.id, pin: pin });
      CHRecord.setStudent(out.student);
      say(out.student.name + ' 학생, 반가워요!', true);
      setTimeout(done, 400);
    } catch (err) { say(err.message); pin = ''; dots(); }
  });

  $('unpair').onclick = function () {
    if (!confirm('이 태블릿의 선생님 등록과 학생 선택을 지울까요? 다시 쓰려면 선생님 구글 로그인이 필요해요.')) return;
    CHRecord.forgetDevice(); boot();
  };

  async function boot() {
    var cfg = await CHRecord.config();
    if (!cfg.on) { done(); return; }
    if (!CHRecord.device()) return startPair(cfg);
    loadStudents();
  }
  boot();
})();
</script>
</body>
</html>
